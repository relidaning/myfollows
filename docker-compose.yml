services:
  douyin-mcp:
    build: ./douyin-mcp
    # host networking: 8082 (UI/API) binds to 127.0.0.1 inside the
    # container, so host networking keeps it host-local, not LAN-exposed.
    network_mode: host
    volumes:
      - ./data:/data
      # YouTube login launches a headed Chromium straight onto the host's
      # own X display instead of a virtual display + VNC (see youtube.py) —
      # this mount plus DISPLAY below is what makes that window actually
      # appear on this desktop. Only works because this container always
      # runs on the same machine as the desktop it's meant to pop up on;
      # it would need rethinking (real OAuth, most likely) on a headless
      # remote host with no X session. The X0 socket is world RW and this
      # host's `xhost` already has an SI:localuser:root entry (default on
      # most desktop distros), so the container's root-owned Chromium
      # process is authorized without needing to mount ~/.Xauthority too —
      # confirmed 2026-07-29 on this machine (Ubuntu/GNOME).
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DATA_DIR=/data
      - TZ=Asia/Shanghai
      - DISPLAY=:0
      # google.com/youtube.com are only reachable through this local proxy
      # on this host (Douyin needs none — see youtube.py). Override if the
      # proxy ever moves; leave unset (empty string) to disable proxying.
      - YOUTUBE_PROXY_SERVER=http://127.0.0.1:10808
    restart: unless-stopped
