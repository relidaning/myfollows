services:
  douyin-mcp:
    build: ./douyin-mcp
    # host networking: 8082 (UI/API), 6082 (noVNC, YouTube login only) and
    # 5900 (x11vnc) all bind to 127.0.0.1 inside the container (see
    # start.sh), so host networking keeps them host-local, not LAN-exposed.
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - TZ=Asia/Shanghai
      # google.com/youtube.com are only reachable through this local proxy
      # on this host (Douyin needs none — see youtube.py). Override if the
      # proxy ever moves; leave unset (empty string) to disable proxying.
      - YOUTUBE_PROXY_SERVER=http://127.0.0.1:10808
    restart: unless-stopped
